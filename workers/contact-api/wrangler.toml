name = "appdraft-contact-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Route for custom domain
[[routes]]
pattern = "appdraft.com/api/*"
zone_name = "appdraft.com"

[vars]
ALLOWED_ORIGIN = "https://appdraft.com"
HUB_ENQUIRY_URL = "https://psa-copilot-api.appdraft-psa.workers.dev/website-enquiry"

# Enquiries go to the AppDraft Hub (TSK-506961). The secret is shared with psa-copilot-api only
# (Doppler prd WEBSITE_ENQUIRY_SECRET):
# wrangler secret put WEBSITE_ENQUIRY_SECRET

# Turnstile (bot protection) - set as secret via wrangler
# wrangler secret put TURNSTILE_SECRET_KEY
# Shared with appdraft-chat-api for /api/contact/internal
# wrangler secret put CONTACT_API_SECRET
